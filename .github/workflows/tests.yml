name: Tests des Office Scripts

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compiler les scripts et lancer les cinq scénarios
        run: npm test
      - name: Conserver les brouillons produits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-des-tests
          path: tests/resultats/
